[package]
name = "opentalk-desktop"
description = "OpenTalk AI desktop shell: Tauri bootstrap and IPC commands."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "opentalk_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
opentalk-audio-capture = { path = "../../../crates/audio-capture" }
opentalk-audio-core = { path = "../../../crates/audio-core" }
opentalk-language = { path = "../../../crates/language" }
opentalk-provider-ollama = { path = "../../../crates/provider-ollama" }
opentalk-provider-openai-compatible = { path = "../../../crates/provider-openai-compatible" }
opentalk-provider-openai = { path = "../../../crates/provider-openai" }
opentalk-provider-whisper = { path = "../../../crates/provider-whisper" }
opentalk-replies = { path = "../../../crates/replies" }
opentalk-transcription = { path = "../../../crates/transcription" }
opentalk-translation = { path = "../../../crates/translation" }
keyring = "4.2.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = [] }
thiserror = "2.0"
tokio = { version = "1.54", features = ["sync"] }

[dev-dependencies]
serde_json = "1.0"
