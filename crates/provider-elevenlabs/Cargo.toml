[package]
name = "opentalk-provider-elevenlabs"
description = "Speech output through ElevenLabs, a cloud service."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
opentalk-speech = { path = "../speech" }
async-trait = "0.1.92"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
serde_json = "1.0"

[dev-dependencies]
opentalk-test-support = { path = "../test-support" }
tokio = { version = "1.54", features = ["macros", "rt"] }
