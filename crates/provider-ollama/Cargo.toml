[package]
name = "opentalk-provider-ollama"
description = "Local translation and reply suggestions through an Ollama server on this computer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
opentalk-replies = { path = "../replies" }
opentalk-translation = { path = "../translation" }
async-trait = "0.1.92"
# Plain HTTP only: the server is on this computer, so no TLS stack is needed.
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
opentalk-test-support = { path = "../test-support" }
opentalk-language = { path = "../language" }
tokio = { version = "1.54", features = ["macros", "rt", "net", "io-util", "time"] }
