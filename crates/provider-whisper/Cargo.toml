[package]
name = "opentalk-provider-whisper"
description = "Local speech recognition with Whisper, built into the app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
opentalk-transcription = { path = "../transcription" }
async-trait = "0.1.92"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.11.1"
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt", "sync", "fs", "io-util"] }
whisper-rs = "0.16.0"

[target.'cfg(target_os = "macos")'.dependencies]
# Use the GPU on Apple hardware.
whisper-rs = { version = "0.16.0", features = ["metal"] }

[dev-dependencies]
opentalk-audio-core = { path = "../audio-core" }
opentalk-test-support = { path = "../test-support" }
tokio = { version = "1.54", features = ["macros", "rt", "sync", "fs", "io-util"] }
