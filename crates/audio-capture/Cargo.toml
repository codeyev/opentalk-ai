[package]
name = "opentalk-audio-capture"
description = "Native microphone and system-audio capture adapters for macOS and Windows."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
opentalk-audio-core = { path = "../audio-core" }
cpal = "0.18.2"
serde = { version = "1.0", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "11.1.2"
