[package]
name = "opentalk-provider-openai-compatible"
description = "Translation, reply suggestions and speech output through any service that speaks the OpenAI API, such as OpenRouter."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
opentalk-replies = { path = "../replies" }
opentalk-speech = { path = "../speech" }
opentalk-translation = { path = "../translation" }
async-trait = "0.1.92"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
serde_json = "1.0"

[dev-dependencies]
opentalk-language = { path = "../language" }
opentalk-test-support = { path = "../test-support" }
tokio = { version = "1.54", features = ["macros", "rt"] }
