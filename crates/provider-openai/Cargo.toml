[package]
name = "opentalk-provider-openai"
description = "OpenAI adapters for OpenTalk AI: Realtime transcription, translation and reply suggestions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
opentalk-language = { path = "../language" }
opentalk-replies = { path = "../replies" }
opentalk-transcription = { path = "../transcription" }
opentalk-translation = { path = "../translation" }
async-trait = "0.1.92"
base64 = "0.23.1"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
# TLS comes from the operating system (Secure Transport on macOS, SChannel on
# Windows), which avoids building a C crypto library and uses the system trust store.
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54", features = ["macros", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["macros", "rt", "sync", "time", "test-util"] }
